name: secscan

services:
  backend:
    build:
      context: ./backend
    environment:
      PORT: "8080"
      GIN_MODE: "release"
      FRONTEND_ORIGIN: "http://localhost:3000"
      SCAN_TIMEOUT_SECONDS: "60"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    environment:
      NODE_ENV: "production"
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
